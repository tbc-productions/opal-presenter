name: Release

on:
  push:
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:
    inputs:
      opal_tag:
        description: 'Existing release tag to rebuild'
        required: true
      build_flatpak:
        description: 'Build Flatpak (requires a runner labelled flatpak-builder)'
        required: false
        default: 'false'

jobs:
  windows-qt-packaging:
    runs-on: windows
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.opal_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install packaging test dependencies
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Qt 6.11 Windows repositories are split by compiler; PyPI 3.3.0 uses the old layout.
          .venv/Scripts/python.exe -m pip install pyinstaller cmake ninja "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7" "PySide6==6.11.1" "shiboken6_generator==6.11.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 --archives qtbase -O .cache/qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/build_fluentqt.py --qt-prefix .cache/qt/6.11.1/msvc2022_64 --install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test packaging guards and freeze Qt probe
        shell: powershell
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests/packaging -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Avoid collecting unrelated DLLs from developer tools on PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          .venv/Scripts/python.exe -m PyInstaller --clean --noconfirm --noupx --name qt-smoke tests/packaging/qt_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run frozen Qt probe without build tools on PATH
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH, Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH, Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          & .\dist\qt-smoke\qt-smoke.exe
          exit $LASTEXITCODE

  pytest:
    runs-on: macos
    env:
      QT_QPA_PLATFORM: offscreen
      PYENCHANT_LIBRARY_PATH: /opt/homebrew/lib/libenchant-2.2.dylib
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.opal_tag || github.ref }}
          fetch-depth: 0

      - name: Install system deps
        run: brew install python@3.14 icu4c enchant pkg-config || true

      - name: Create venv and install project
        run: |
          PY=/opt/homebrew/opt/python@3.14/bin/python3.14
          export PATH="/opt/homebrew/opt/python@3.14/bin:/opt/homebrew/opt/icu4c/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$PY" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install cmake ninja aqtinstall "PySide6==6.11.1" "shiboken6_generator==6.11.1"
          .venv/bin/python -m aqt install-qt mac desktop 6.11.1 clang_64 --archives qtbase -O .cache/qt
          .venv/bin/python scripts/build_fluentqt.py --qt-prefix .cache/qt/6.11.1/macos --install
          .venv/bin/python -m pip install -e '.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles,test]'

      - name: Generate resources
        run: |
          if [ -x scripts/generate_resources.sh ]; then
            sh scripts/generate_resources.sh
          fi

      - name: Run pytest
        run: .venv/bin/pytest --color=no --disable-warnings

  release:
    name: Create release and notify packaging
    needs: [windows-qt-packaging, pytest]
    runs-on: ubuntu-22.04
    env:
      OPAL_TAG: ${{ github.event.inputs.opal_tag || github.ref_name }}
      OPAL_BUILD_FLATPAK: ${{ github.event.inputs.build_flatpak || 'false' }}
    steps:
      - name: Create Gitea release
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${OPAL_TAG}"
          PRERELEASE=false
          case "$TAG" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev*) PRERELEASE=true ;;
          esac
          BODY=$(printf '{"tag_name":"%s","name":"Opal Presenter %s","body":"Opal Presenter %s introduces an independent application identity and native document formats. Legacy OpenLP files remain importable. Install alongside the previous app; profiles are independent. See documentation/opal-formats.rst for compatibility details.","draft":true,"prerelease":%s}' "$TAG" "$TAG" "$TAG" "$PRERELEASE")
          HTTP_CODE=$(curl -sS -o /tmp/release_response.json -w '%{http_code}' -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/release_response.json || true
          echo
          case "$HTTP_CODE" in
            2??)  echo "Release created for ${TAG}." ;;
            409)  curl -fsS -H "Authorization: token ${CI_TOKEN}" \
                    "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /dev/null
                  echo "Release for ${TAG} already exists; continuing." ;;
            *)    echo "Failed to create release (HTTP ${HTTP_CODE})." >&2; exit 1 ;;
          esac

      - name: Trigger opal-presenter-packaging build
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${OPAL_TAG}"
          PAYLOAD=$(printf '{"ref":"main","inputs":{"opal_tag":"%s","create_release":"true","build_macos":"true","build_windows":"true","build_flatpak":"%s"}}' "$TAG" "$OPAL_BUILD_FLATPAK")
          curl -sSL --fail-with-body -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GITHUB_SERVER_URL}/api/v1/repos/tbcproductions/opal-presenter-packaging/actions/workflows/build.yml/dispatches"
