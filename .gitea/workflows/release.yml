name: Release

on:
  push:
    tags: ['[0-9]*', 'v*']

jobs:
  release:
    name: Create release and notify packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Create Gitea release
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BODY=$(printf '{"tag_name":"%s","name":"%s","body":"Automated release of %s","draft":true,"prerelease":false}' "$TAG" "$TAG" "$TAG")
          HTTP_CODE=$(curl -sS -o /tmp/release_response.json -w '%{http_code}' -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/release_response.json || true
          echo
          case "$HTTP_CODE" in
            2??)  echo "Release created for ${TAG}." ;;
            409)  echo "Release for ${TAG} already exists; continuing." ;;
            *)    echo "Failed to create release (HTTP ${HTTP_CODE})." >&2; exit 1 ;;
          esac

      - name: Trigger opal-presenter-packaging build
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PAYLOAD=$(printf '{"ref":"main","inputs":{"opal_tag":"%s","create_release":"true","build_macos":"true","build_windows":"true","build_flatpak":"true"}}' "$TAG")
          curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GITHUB_SERVER_URL}/api/v1/repos/tbcproductions/opal-presenter-packaging/actions/workflows/build.yml/dispatches"
