name: Release

on:
  push:
    tags: ['[0-9]*', 'v*']

jobs:
  test:
    uses: ./.gitea/workflows/test.yml

  release:
    name: Create release and notify packaging
    needs: test
    runs-on: self-hosted
    steps:
      - name: Create Gitea release
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(printf '{"tag_name":"%s","name":"%s","body":"Automated release of %s","draft":false,"prerelease":false}' "$TAG" "$TAG" "$TAG")
          curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases"

      - name: Trigger openlp-packaging build
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PAYLOAD=$(printf '{"event_type":"upstream-release","client_payload":{"source":"openlp-plus","tag":"%s"}}' "$TAG")
          curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GITHUB_SERVER_URL}/api/v1/repos/tbcproductions/openlp-packaging/dispatches"
