name: Release

on:
  push:
    tags: ['[0-9]*', 'v*']

jobs:
  release:
    name: Create release and notify packaging
    runs-on: self-hosted
    steps:
      - name: Create Gitea release
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(printf '{"tag_name":"%s","name":"%s","body":"Automated release of %s","draft":false,"prerelease":false}' "$TAG" "$TAG" "$TAG")
          curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases"

      - name: Trigger openlp-packaging build
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PAYLOAD=$(printf '{"ref":"main","inputs":{"openlp_tag":"%s","create_release":"true","build_macos":"true","build_windows":"true","build_flatpak":"false"}}' "$TAG")
          curl -fsSL -X POST \
            -H "Authorization: token ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GITHUB_SERVER_URL}/api/v1/repos/tbcproductions/openlp-packaging/actions/workflows/build.yml/dispatches"
