name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
    env:
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libasound2 libpulse0 enchant-2 libicu-dev pkg-config

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test extras
        run: |
          pip install -e '.[darkstyle,mysql,odbc,postgresql,spellcheck,sword-bibles,test]'

      - name: Generate resources
        run: |
          if [ -x scripts/generate_resources.sh ]; then
            sh scripts/generate_resources.sh
          fi

      - name: Run pytest
        run: xvfb-run -s '-screen 0 1024x768x24' pytest --color=no --disable-warnings
