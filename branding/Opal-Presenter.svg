<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1254" height="1254" viewBox="0 0 1254 1254"><title>Iridescent fan app icon</title><desc>Layered vector recreation with editable opal colour fields, curved facets and luminous outlines. No embedded raster image. The fine photographic grain is approximated by smooth gradients.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06317a"/><stop offset=".45" stop-color="#001448"/><stop offset="1" stop-color="#000b2b"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#36ecff"/><stop offset=".2" stop-color="#007dff"/><stop offset=".7" stop-color="#163bea"/><stop offset="1" stop-color="#0062df"/></linearGradient>
<radialGradient id="blue"><stop stop-color="#087eff" stop-opacity=".85"/><stop offset="1" stop-color="#087eff" stop-opacity="0"/></radialGradient>
<linearGradient id="opal" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#fbecff"/><stop offset=".22" stop-color="#a7caff"/><stop offset=".42" stop-color="#90e9f5"/><stop offset=".60" stop-color="#d2ffee"/><stop offset=".78" stop-color="#ffe0fc"/><stop offset="1" stop-color="#fcffff"/></linearGradient>
<linearGradient id="facet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb8fa"/><stop offset=".23" stop-color="#8b79f3"/><stop offset=".5" stop-color="#16b9fa"/><stop offset=".75" stop-color="#55e9f7"/><stop offset="1" stop-color="#fff"/></linearGradient>
<radialGradient id="pink"><stop stop-color="#ff99f1" stop-opacity=".95"/><stop offset="1" stop-color="#ffa9f3" stop-opacity="0"/></radialGradient>
<radialGradient id="aqua"><stop stop-color="#73f9ef" stop-opacity=".65"/><stop offset="1" stop-color="#44f7ed" stop-opacity="0"/></radialGradient>
<radialGradient id="white"><stop stop-color="#fff"/><stop offset=".45" stop-color="#fffff4" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="pearl" cx=".35" cy=".25" r=".9"><stop stop-color="#fff"/><stop offset=".4" stop-color="#f9ffff"/><stop offset=".7" stop-color="#e8d7ff"/><stop offset="1" stop-color="#50e9fa"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15"/></filter>
<clipPath id="tile"><rect x="34" y="21" width="1186" height="1204" rx="246"/></clipPath>
<path id="shape-centre" d="M615 1027 L475 160 Q466 127 501 127 L751 127 Q787 127 779 160 L639 1027 Z"/><clipPath id="clip-centre"><use xlink:href="#shape-centre"/></clipPath>
<path id="shape-inner-left" d="M598 1045 L200 366 Q184 342 213 326 L386 229 Q414 211 425 246 L618 1030 Z"/><clipPath id="clip-inner-left"><use xlink:href="#shape-inner-left"/></clipPath>
<path id="shape-inner-right" d="M655 1045 L1053 366 Q1069 342 1040 326 L867 229 Q839 211 828 246 L635 1030 Z"/><clipPath id="clip-inner-right"><use xlink:href="#shape-inner-right"/></clipPath>
<path id="shape-outer-left" d="M583 1055 L65 624 Q46 607 65 585 L162 482 Q181 465 197 485 L598 1038 Z"/><clipPath id="clip-outer-left"><use xlink:href="#shape-outer-left"/></clipPath>
<path id="shape-outer-right" d="M670 1055 L1188 624 Q1207 607 1188 585 L1091 482 Q1072 465 1056 485 L655 1038 Z"/><clipPath id="clip-outer-right"><use xlink:href="#shape-outer-right"/></clipPath>
</defs>
<g id="background" inkscape:groupmode="layer" inkscape:label="01 Rounded background"><rect x="34" y="21" width="1186" height="1204" rx="246" fill="url(#bg)"/></g>
<g id="background-light" inkscape:groupmode="layer" inkscape:label="02 Background illumination"><g clip-path="url(#tile)"><ellipse cx="630" cy="24" rx="720" ry="170" fill="url(#blue)"/><ellipse cx="628" cy="1035" rx="500" ry="415" fill="url(#blue)"/><ellipse cx="628" cy="1240" rx="400" ry="65" fill="url(#blue)"/></g></g>
<g id="tile-outline" inkscape:groupmode="layer" inkscape:label="03 Tile luminous border"><rect x="34" y="21" width="1186" height="1204" rx="246" fill="none" stroke="url(#rim)" stroke-width="7"/></g>
<g clip-path="url(#tile)" id="ray-glows" inkscape:groupmode="layer" inkscape:label="04 Ray glow"><g filter="url(#glow)" fill="#008cff" stroke="#09cfff" stroke-width="11"><use xlink:href="#shape-centre"/><use xlink:href="#shape-inner-left"/><use xlink:href="#shape-inner-right"/><use xlink:href="#shape-outer-left"/><use xlink:href="#shape-outer-right"/></g></g>
<g id="ray-outer-left" inkscape:groupmode="layer" inkscape:label="05 Ray — outer-left"><use xlink:href="#shape-outer-left" fill="url(#opal)"/><path d="M57 607 Q400 665 589 1050 L65 624Z" fill="url(#facet)"/><g clip-path="url(#clip-outer-left)"><ellipse cx="125" cy="602" rx="130" ry="65" fill="url(#pink)"/><ellipse cx="314" cy="691" rx="125" ry="55" fill="url(#white)"/><ellipse cx="312" cy="630" rx="70" ry="100" fill="url(#aqua)"/></g><use xlink:href="#shape-outer-left" fill="none" stroke="#e9ffff" stroke-width="3.5" stroke-linejoin="round"/></g>
<g id="ray-outer-right" inkscape:groupmode="layer" inkscape:label="05 Ray — outer-right"><use xlink:href="#shape-outer-right" fill="url(#opal)"/><path d="M1196 607 Q853 665 664 1050 L1188 624Z" fill="url(#facet)"/><g clip-path="url(#clip-outer-right)"><ellipse cx="1128" cy="602" rx="130" ry="65" fill="url(#pink)"/><ellipse cx="939" cy="691" rx="125" ry="55" fill="url(#white)"/><ellipse cx="941" cy="630" rx="70" ry="100" fill="url(#aqua)"/></g><use xlink:href="#shape-outer-right" fill="none" stroke="#e9ffff" stroke-width="3.5" stroke-linejoin="round"/></g>
<g id="ray-inner-left" inkscape:groupmode="layer" inkscape:label="05 Ray — inner-left"><use xlink:href="#shape-inner-left" fill="url(#opal)"/><path d="M195 351 Q475 500 611 1037 L200 366Z" fill="url(#facet)"/><g clip-path="url(#clip-inner-left)"><ellipse cx="234" cy="346" rx="145" ry="74" fill="url(#pink)"/><ellipse cx="397" cy="347" rx="70" ry="150" fill="url(#aqua)"/><ellipse cx="502" cy="681" rx="45" ry="250" fill="url(#white)"/><ellipse cx="552" cy="881" rx="45" ry="150" fill="url(#aqua)"/></g><use xlink:href="#shape-inner-left" fill="none" stroke="#e9ffff" stroke-width="3.5" stroke-linejoin="round"/></g>
<g id="ray-inner-right" inkscape:groupmode="layer" inkscape:label="05 Ray — inner-right"><use xlink:href="#shape-inner-right" fill="url(#opal)"/><path d="M1058 351 Q778 500 642 1037 L1053 366Z" fill="url(#facet)"/><g clip-path="url(#clip-inner-right)"><ellipse cx="1019" cy="346" rx="145" ry="74" fill="url(#pink)"/><ellipse cx="856" cy="347" rx="70" ry="150" fill="url(#aqua)"/><ellipse cx="751" cy="681" rx="45" ry="250" fill="url(#white)"/><ellipse cx="701" cy="881" rx="45" ry="150" fill="url(#aqua)"/></g><use xlink:href="#shape-inner-right" fill="none" stroke="#e9ffff" stroke-width="3.5" stroke-linejoin="round"/></g>
<g id="ray-centre" inkscape:groupmode="layer" inkscape:label="05 Ray — centre"><use xlink:href="#shape-centre" fill="url(#opal)"/><g clip-path="url(#clip-centre)"><ellipse cx="760" cy="175" rx="150" ry="200" fill="url(#pink)"/><ellipse cx="548" cy="240" rx="150" ry="210" fill="url(#aqua)"/><ellipse cx="554" cy="456" rx="92" ry="130" fill="url(#pink)"/><ellipse cx="655" cy="637" rx="72" ry="260" fill="url(#pink)"/><ellipse cx="620" cy="780" rx="55" ry="340" fill="url(#white)"/><ellipse cx="690" cy="370" rx="70" ry="190" fill="url(#aqua)"/><ellipse cx="632" cy="133" rx="120" ry="100" fill="url(#white)"/></g><use xlink:href="#shape-centre" fill="none" stroke="#e9ffff" stroke-width="3.5" stroke-linejoin="round"/></g>
<g id="source-glow" inkscape:groupmode="layer" inkscape:label="06 Pearl glow"><circle cx="627" cy="1071" r="62" fill="#269cff" filter="url(#glow)"/></g>
<g id="source" inkscape:groupmode="layer" inkscape:label="07 Pearl light source"><circle cx="627" cy="1071" r="48" fill="url(#pearl)" stroke="#f4ffff" stroke-width="3"/></g>
</svg>