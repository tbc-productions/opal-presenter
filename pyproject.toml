[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opal-presenter"
dynamic = ["version"]
description = "Open-source church presentation and lyrics projection application."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Opal Presenter Developers", email = "developer@tbcproductions.net" },
]
keywords = [
    "bible",
    "church",
    "display",
    "lyrics",
    "open",
    "presentation",
    "project",
    "projection",
    "song",
    "source",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Afrikaans",
    "Natural Language :: Dutch",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Hungarian",
    "Natural Language :: Indonesian",
    "Natural Language :: Japanese",
    "Natural Language :: Norwegian",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Russian",
    "Natural Language :: Swedish",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Religion",
]
dependencies = [
    "imageio-ffmpeg >= 0.6, < 0.7",
    "alembic >= 1.20.0",
    "beautifulsoup4 >= 4.15.0",
    "chardet >= 7.6.0",
    "distro; platform_system == 'Linux'",
    "FluentQt == 1.9.3+openlp.1",
    "flask",
    "flask-cors >= 6.0.5",
    "imagecodecs",
    "lxml >= 6.1.3",
    "keyring >= 25.0",
    "Mako >= 1.4.3",
    "numpy",
    "pillow >= 12.3.0",
    "platformdirs >= 4.12.3",
    "python-pptx",
    "odfpy",
    "PyICU; platform_system != 'Windows'",
    "pyobjc-framework-Cocoa; platform_system == 'Darwin'",
    "pyobjc; platform_system == 'Darwin'",
    "PySide6 == 6.11.1; platform_system == 'Windows'",
    "PySide6-QtAds == 5.0.0.2",
    "PySide6 == 6.11.1; platform_system == 'Darwin'",
    "PySide6 == 6.11.1; platform_system == 'Linux'",
    "Pyro5 >= 5.17; platform_system == 'Darwin'",
    "pywin32; platform_system == 'Windows'",
    "qrcode",
    "QtAwesome",
    "requests >= 2.34.2",
    "SQLAlchemy >= 2.1.3",
    "waitress",
    "websocket-client >= 1.9.2",
    "websockets >= 17.2",
]

[project.optional-dependencies]
agpl-pdf = [
    "PyMuPDF",
]
darkstyle = [
]
mysql = [
    "PyMySQL",
]
odbc = [
    "pyodbc",
]
postgresql = [
    "psycopg2-binary",
]
spellcheck = [
    "pyenchant >= 1.6",
]
sword-bibles = [
    "pysword",
]
test = [
    "flake8",
    "hatch",
    "PyMuPDF",
    "pyodbc",
    "pysword",
    "pytest",
    "pytest-qt",
]

[project.scripts]
opal-presenter = "openlp.__main__:start"

[project.entry-points.pyinstaller40]
hook-dirs = "openlp.__pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "https://git.tbcproductions.net/tbcproductions/opal-presenter"
Source = "https://git.tbcproductions.net/tbcproductions/opal-presenter"
Issues = "https://git.tbcproductions.net/tbcproductions/opal-presenter/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "openlp/.version"
template = "{version}"

[tool.hatch.build.targets.sdist]
include = [
    "/openlp",
]

[tool.hatch.build.targets.wheel]
packages = [
    "openlp",
]

[tool.hatch.envs.default]
dependencies = [
    "hatchling",
    "hatch-vcs"
]

[tool.hatch.envs.default.scripts]
# For those who have problems running "hatch run opal-presenter"
run_opal_presenter = "python run_opal_presenter.py"

dependencies = [
    "flake8",
    "hatchling",
    "pyenchant >= 1.6",
    "pyodbc",
    "pytest",
    "pytest-qt",
    "pytest-cov",
]

[tool.hatch.envs.test.scripts]
run = "pytest tests {args}"
run_selected = "pytest {args}"
cov = "pytest tests --cov openlp --cov-report html {args}"
debug = "pytest tests --pudb {args}"
ci = "pytest tests --color=no --disable-warnings {args}"

[dependency-groups]
test = [
    "pytest",
    "pytest-qt",
]
